project_name: "highest-grossing-films"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # Box Office Mojo — Top Lifetime Adjusted Grosses (domestic, US/Canada).
  # The `adjust_gross_to` query param sets the reference year for ticket-price
  # inflation; the page then returns, per film: adjusted gross, nominal
  # ("Lifetime") gross, estimated tickets sold, and release year.
  # Static-fetchable (no JS) when the adjust_gross_to param is supplied.
  bom_adjusted:
    url: "https://www.boxofficemojo.com/chart/top_lifetime_gross_adjusted/?adjust_gross_to=2022"
    type: html_table
    table_index: 0
    js_render: false
    adjust_to_year: 2022   # reference year the adjusted grosses are expressed in

  # Adjustment method note (for SOURCES.md / codebook):
  #   Box Office Mojo adjusts by estimated tickets sold × the reference-year
  #   average ticket price — i.e. ticket-price inflation, NOT CPI. Domestic only.

  # Box Office Mojo — Top Lifetime Grosses WORLDWIDE. Per film: worldwide,
  # domestic, and foreign lifetime gross + domestic%/foreign% split. NOMINAL
  # (year-of-release) dollars, not inflation-adjusted. Static-fetchable.
  bom_worldwide:
    url: "https://www.boxofficemojo.com/chart/ww_top_lifetime_gross/"
    type: html_table
    table_index: 0
    js_render: false

  # TMDB — genre enrichment (looked up per film by title + year).
  # Requires a free API key in .env: TMDB_API_KEY (v3) or TMDB_READ_TOKEN (v4).
  # Not a config URL source; queried via src/ingest genre helper.
  tmdb:
    api_base: "https://api.themoviedb.org/3"
    # key/token read from environment (.env), never committed.

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
